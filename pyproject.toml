[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dmharness"
version = "0.1.0"
description = "Harness для AI-агента системного аналитика: Research → CJM → HLD → ФТ/НФТ → ТЗ"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
dmharness = "dmharness.cli:main"

[tool.setuptools]
packages = ["dmharness"]
